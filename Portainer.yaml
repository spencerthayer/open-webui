# Open WebUI — Portainer Stack
#
# Deploy from Portainer Git (required for searchable base-model picker):
#   Repository: https://github.com/spencerthayer/open-webui
#   Reference: build
#   Compose path: docs/portainer.stack.yaml
#
# NOTE: If build fails with exit code 1, ensure your Portainer build cache
# is cleared — the `build` branch was pushed with fixes for the Node.js
# heap OOM during frontend build.
#
# Usage:
#   1. In Portainer → Stacks → Add stack (or update existing)
#   2. Web editor → Git repository → set Repository + Reference above
#   3. Set WEBUI_SECRET_KEY and OPENAI_API_KEY as needed
#   4. Deploy and wait for the source build to finish
services:
  open-webui:
    container_name: open-webui
    build:
      context: https://github.com/spencerthayer/open-webui.git#build
      dockerfile: Dockerfile
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - '11480:8080'
    volumes:
      - /appdata/openwebui:/app/backend/data
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
    environment:
      # ── Timezone ──────────────────────────────────────────────────────────
      TZ: America/Los_Angeles
      OLLAMA_BASE_URLS: ''
      OPENAI_API_KEY: ${OPENAI_API_KEY}

